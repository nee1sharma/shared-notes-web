spring:
  application:
    name: netbook
  datasource:
    url: ${NETBOOK_DB_URL:jdbc:postgresql://localhost:5432/netbook}
    username: ${NETBOOK_DB_USER:netbook}
    password: ${NETBOOK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10s
  flyway:
    enabled: true
  jdbc:
    template:
      query-timeout: 10s

server:
  # The filter below still limits the browser/admin interface to localhost.
  # Binding the socket to every interface lets registered Android devices use
  # the separately authenticated mobile API on the home LAN.
  address: 0.0.0.0
  port: 8080
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
      timeout: 30m

netbook:
  node:
    role: ROOT_ADMIN_HOST
    id: ${NETBOOK_NODE_ID:}
    name: ${NETBOOK_DEVICE_NAME:}
    member-name: ${NETBOOK_MEMBER_NAME:}
    app-name: NetBook Web
    type: ${NETBOOK_DEVICE_TYPE:LAPTOP}
    platform: ${NETBOOK_DEVICE_PLATFORM:WEB}
    auto-start-discovery: true
  web:
    enabled: true
    root-admin-loopback-only: true
    lan-access-enabled: false
    lan-bind-address: 0.0.0.0
    lan-port: 8443
    lan-https-required: true
    tls-certificate-ref: ${NETBOOK_TLS_CERT_REF:}
    tls-private-key-ref: ${NETBOOK_TLS_KEY_REF:}
  security:
    # A base64-encoded 32-byte AES key. It is required at startup and is used
    # for display names and shared-note payloads stored in PostgreSQL.
    master-key: ${NETBOOK_MASTER_KEY:}
    master-key-ref: ${NETBOOK_MASTER_KEY_REF}
    signing-key-ref: ${NETBOOK_SIGNING_KEY_REF}
    content-cipher: AES_256_GCM
    key-provider: OS_KEYSTORE
    admin-reauthentication: 5m
    authentication-max-failures: 5
    authentication-lockout: 15m
    passkeys:
      enabled: true
      relying-party-id: ${NETBOOK_PASSKEY_RP_ID:localhost}
      relying-party-name: NetBook
      allowed-origins:
        - ${NETBOOK_PASSKEY_ORIGIN:http://localhost:8080}
      user-verification: REQUIRED
      attestation: NONE
      challenge-timeout: 2m
      max-credentials-per-admin: 5
  home-lan:
    profile-ref: ${NETBOOK_HOME_LAN_PROFILE_REF}
  discovery:
    enabled: true
    service-type: _netbook._tcp.local.
    bind-address: 0.0.0.0
    # The mDNS service advertises the authenticated mobile HTTP endpoint.
    port: ${server.port}
    heartbeat-interval: 15s
    # WorkManager's minimum periodic interval is 15 minutes.
    offline-after: 20m
    stale-after: 24h
  enrollment:
    android-enabled: true
    android-mode: OPEN_ON_HOME_LAN
    web-enabled: true
    web-mode: ADMIN_APPROVAL_REQUIRED
    request-retention: 7d
  synchronization:
    web-trigger-mode: AFTER_EACH_SAVE
    reconciliation-interval: 30s
    batch-size: 200
    command-timeout: 60s
  history:
    note-revisions-default: 5
    note-revisions-min: 1
    note-revisions-max: 100
    activity-retention-default: 100d
    activity-retention-min: 1d
    activity-retention-max: 3650d
  trash:
    retention-default: 30d
    retention-min: 1d
    retention-max: 365d
    purge-cron: "0 0 3 * * *"
  sessions:
    idle-timeout-default: 30m
    idle-timeout-min: 5m
    idle-timeout-max: 12h
    absolute-timeout: 24h
    max-concurrent-per-web-device: 2
  private-delivery:
    acknowledgement-timeout: 5m
    job-retention: 30d
    require-owned-device: true
  roles:
    delegated-admin-can-grant-admin: false
  audit:
    page-size-default: 100
    page-size-max: 500
  notes-list:
    page-size-default: 20
    page-size-max: 20
    scan-batch-size: 200
    cursor-ttl: 5m
    search-fields:
      - TITLE
      - CREATED_BY
      - LAST_EDITED_BY
      - MODIFIED_DATE
      - CONFLICT_STATE
    plaintext-search-index-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
